name: GLPM SportMonks daily sync

# Morning discovers today's slate (in GLPM_MATCHDAY_TIMEZONE), then a dispatcher
# fires lineup / results / night refresh when due.
#
# Night refresh (refresh phase) trains engines, runs glpm:backfill-vs-style for
# CX style-lift charts, then force-writes upcoming GLPM prediction snapshots.
#
# Required secrets:
#   SPORTMONKS_API_TOKEN
#   SUPABASE_URL (or NEXT_PUBLIC_SUPABASE_URL)
#   SUPABASE_SERVICE_ROLE_KEY
#   GLPM_MATCHDAY_TIMEZONE  — IANA tz for your locale (e.g. Africa/Lagos, Europe/Berlin)
#
# Optional:
#   NEXT_PUBLIC_SUPABASE_ANON_KEY (not required for service client)
#
# Related workflows:
#   glpm-vs-style-backfill.yml  — manual bulk vs-style backfill
#   glpm-standings-refresh.yml  — schedules + standings via production crons
#   glpm-livescores.yml         — in-play livescores poll via production cron

on:
  schedule:
    # Morning — early enough to be morning in most of Europe / West Africa
    - cron: "30 3 * * *"
    # Dispatcher every 15m during EU matchday hours (UTC)
    - cron: "*/15 8-23 * * *"
    # Late-night dispatcher for results/refresh after midnight UTC
    - cron: "0,15,30,45 0-2 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: "morning | lineup | results | refresh | auto"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - lineup
          - results
          - refresh
      match_date:
        description: "Optional YYYY-MM-DD override"
        required: false
        type: string
      dry_run:
        description: "Skip writes / train"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        if: ${{ github.event_name == 'schedule' || inputs.phase == 'auto' || inputs.phase == 'refresh' || inputs.phase == 'results' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ml/requirements.txt

      - name: Install ML dependencies
        if: ${{ github.event_name == 'schedule' || inputs.phase == 'auto' || inputs.phase == 'refresh' || inputs.phase == 'results' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/ml/requirements.txt
          bash scripts/ml/setup-venv.sh || true

      - name: Resolve phase
        id: phase
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PHASE="${{ inputs.phase }}"
          else
            # 03:30 UTC cron → morning; everything else → auto dispatcher
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            if [ "$HOUR" = "03" ] && [ "$MIN" = "30" ]; then
              PHASE=morning
            else
              PHASE=auto
            fi
          fi
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "Resolved phase=$PHASE"

      - name: Run SportMonks daily sync
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GLPM_MATCHDAY_TIMEZONE: ${{ secrets.GLPM_MATCHDAY_TIMEZONE }}
        run: |
          set -euo pipefail
          PHASE="${{ steps.phase.outputs.phase }}"
          EXTRA=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA+=(--dry-run)
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.match_date }}" ]; then
            EXTRA+=(--match-date "${{ inputs.match_date }}")
          fi
          npx tsx scripts/glpm-sportmonks-daily-sync.ts --phase "$PHASE" "${EXTRA[@]}"
